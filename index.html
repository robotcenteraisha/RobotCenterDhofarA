<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>كشف الاستعارة والإرجاع</title>

  <style>
    body {
      background-color: #f3e8ff;
      font-family: 'Sakkal Majalla', sans-serif;
      font-weight: bold;
      text-align: center;
      padding: 20px;
    }

    h1 {
      color: black;
      margin-top: 15px;
    }

    button {
      background-color: #ffcc80;
      color: black;
      border: 3px solid black;
      padding: 15px 30px;
      margin: 10px;
      font-size: 18px;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background-color: #ffa726;
      transform: scale(1.05);
    }

    .form-container {
      background-color: rgba(255,255,255,0.95);
      border-radius: 15px;
      padding: 30px;
      max-width: 600px;
      margin: 30px auto;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
      border: 4px solid black;
    }

    input, textarea {
      width: 80%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 16px;
      text-align: center;
      font-family: 'Sakkal Majalla', sans-serif;
      font-weight: bold;
    }

    textarea {
      height: 120px;
      resize: vertical;
    }

    .back-button {
      font-size: 30px;
      cursor: pointer;
      display: block;
    }

    /* نافذة البداية */
    .start-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .start-box {
      background: white;
      border: 4px solid black;
      border-radius: 15px;
      padding: 30px;
      width: 90%;
      max-width: 500px;
    }
  </style>
</head>

<body>

  <!-- ✅ الشعار الجديد -->
  <div style="display:flex; justify-content:center; margin-bottom:20px;">
    <img src="7f73338f-33ea-4eb4-b08d-70c0cb61576f.png"
         alt="شعار وزارة التربية والتعليم"
         style="max-width:450px; width:100%; height:auto;">
  </div>

  <h1>كشف استعارة أدوات وأجهزة مركز الابتكار العلمي والروبوت - محافظة ظفار -</h1>

  <!-- نافذة اختيار البداية -->
  <div id="startModal" class="start-modal">
    <div class="start-box">
      <h2>اختاري نوع البيانات</h2>
      <button onclick="startChoice('borrow')">1️⃣ بيانات الاستعارة</button>
      <button onclick="startChoice('return')">2️⃣ بيانات الإرجاع</button>
    </div>
  </div>

  <!-- نموذج الاستعارة -->
  <div id="borrowForm" style="display:none;">
    <div class="form-container">
      <form id="formBorrow">

        <input type="hidden" name="type" value="استعارة">

        <input type="text" name="employee" placeholder="اسم الموظف" required><br>
        <input type="text" name="school" placeholder="اسم المدرسة / الجهة" required><br>
        <input type="text" name="borrower" placeholder="اسم المستعير" required><br>
        <input type="tel" name="phone" placeholder="رقم الهاتف" required><br>
        <textarea name="items" placeholder="بيانات الأدوات والأجهزة" required></textarea><br>
        <input type="date" name="date" required><br>

        <button type="submit">إرسال</button>
      </form>
    </div>
    <span class="back-button" onclick="back()">🔙</span>
  </div>

  <!-- نموذج الإرجاع -->
  <div id="returnForm" style="display:none;">
    <div class="form-container">
      <form id="formReturn">

        <input type="hidden" name="type" value="إرجاع">

        <input type="text" name="school" placeholder="اسم المدرسة / الجهة" required><br>
        <input type="text" name="borrower" placeholder="اسم المستعير" required><br>
        <input type="tel" name="phone" placeholder="رقم الهاتف" required><br>
        <input type="text" name="receiver" placeholder="اسم المستلم" required><br>
        <input type="text" name="status" placeholder="حالة الإرجاع" required><br>
        <input type="date" name="date" required><br>

        <button type="submit">إرسال</button>
      </form>
    </div>
    <span class="back-button" onclick="back()">🔙</span>
  </div>

  <script>
    const scriptURL = "https://script.google.com/macros/s/AKfycbyPBwx6q6BZWadvjCg2EwgN6IErZ1BVKoeRdydsFEqA_sIXP-C-K_IiGty8Kmuua96c/exec";

    function startChoice(type) {
      document.getElementById("startModal").style.display = "none";
      showForm(type);
    }

    function showForm(type) {
      document.getElementById("borrowForm").style.display = (type === "borrow") ? "block" : "none";
      document.getElementById("returnForm").style.display = (type === "return") ? "block" : "none";
    }

    function back() {
      document.getElementById("borrowForm").style.display = "none";
      document.getElementById("returnForm").style.display = "none";
      document.getElementById("startModal").style.display = "flex";
    }

    // إرسال الاستعارة
    document.getElementById("formBorrow").addEventListener("submit", function(e) {
      e.preventDefault();
      const data = new FormData(this);
      const phone = data.get("phone");

      fetch(scriptURL, { method: "POST", body: data });

      const msg = `🔶 بيانات الاستعارة:
اسم الموظف: ${data.get("employee")}
المدرسة: ${data.get("school")}
المستعير: ${data.get("borrower")}
الهاتف: ${data.get("phone")}
الأجهزة: ${data.get("items")}
التاريخ: ${data.get("date")}`;

      window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, "_blank");

      alert("✅ تم إرسال بيانات الاستعارة");
      this.reset();
      back();
    });

    // إرسال الإرجاع
    document.getElementById("formReturn").addEventListener("submit", function(e) {
      e.preventDefault();
      const data = new FormData(this);
      const phone = data.get("phone");

      fetch(scriptURL, { method: "POST", body: data });

      const msg = `🔶 بيانات الإرجاع:
المدرسة: ${data.get("school")}
المستعير: ${data.get("borrower")}
المستلم: ${data.get("receiver")}
الحالة: ${data.get("status")}
التاريخ: ${data.get("date")}`;

      window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, "_blank");

      alert("✅ تم إرسال بيانات الإرجاع");
      this.reset();
      back();
    });
  </script>

</body>
</html>
